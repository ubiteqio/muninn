# Development overlay. Never use this in a deployment.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up -d
#
# It does two things: it publishes the databases on the loopback interface so that psql, a GUI
# or a local process can reach them, and it replaces the web container with Vite's development
# server. The built image serves a bundle made when it was built - a change to the app is only
# there after another build. The development server serves the source and reloads on every save,
# at the same address, so a phone in the house sees the change too.
services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      # Inside Docker the API is a neighbour, not a published port.
      MUNINN_API_URL: http://api:8000
      MUNINN_WEB_PORT: 9090
    volumes:
      - ../app:/app
      # The container keeps its own: the host's may have been installed for another platform.
      - web-node-modules:/app/node_modules
    command:
      - sh
      - -c
      - corepack enable && pnpm install --frozen-lockfile && pnpm dev

  postgres:
    ports:
      - "127.0.0.1:${MUNINN_POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "127.0.0.1:${MUNINN_REDIS_PORT:-6379}:6379"

volumes:
  web-node-modules:
