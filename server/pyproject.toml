[project]
name = "muninn"
version = "1.0.0"
license = "MIT"
description = "Muninn server: API, indexing worker and scheduler"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "blake3>=1.0",
    "pyvips>=3.0",
    # Talking to the AI server, which is the only thing Muninn calls out to.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    # libvips for machines that have none; the image installs Debian's, which reads HEIC.
    "pyvips-binary>=8.18",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["muninn"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "ASYNC", "S", "C4", "PT", "TID"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["ANN", "N", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*", "celery.*", "kombu.*", "blake3.*", "pyvips.*"]
ignore_missing_imports = true

# Celery ships no types, so its decorators come back untyped. The task bodies are checked.
[[tool.mypy.overrides]]
module = ["muninn.huginn.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "database: needs the PostgreSQL testcontainer (set automatically from the fixtures a test uses)",
]
asyncio_mode = "auto"
# One event loop for the whole session: the database engine is created once and every test
# has to run on the same loop as that engine.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
