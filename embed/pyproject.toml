[project]
name = "muninn-embed"
version = "1.0.0"
license = "MIT"
description = "Muninn's embedding service: pictures and words in the same vector space"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pillow>=11.0",
    "torch>=2.5",
    "transformers>=4.57",
    "sentencepiece>=0.2",
    "python-multipart>=0.0.20",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    # Faces: on the Linux machine with the card the CUDA build, anywhere else the plain one.
    # 1.30 is built for CUDA 13, the same as torch here, so both share its libraries.
    "onnxruntime-gpu>=1.30; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "onnxruntime>=1.30; sys_platform != 'linux' or platform_machine != 'x86_64'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embed"]
